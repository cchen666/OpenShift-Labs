apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak-external-db
  namespace: keycloak
spec:
  db:
    database: keycloak
    host: 10.8.68.121
    passwordSecret:
      key: password
      name: keycloak-db-secret
    poolInitialSize: 30
    poolMaxSize: 30
    poolMinSize: 30
    port: 3306
    usernameSecret:
      key: username
      name: keycloak-db-secret
    vendor: mariadb
  hostname:
    hostname: keycloak.apps.ocp420.XXXX.cc
  http:
    httpEnabled: true
  instances: 3
  proxy:
    headers: xforwarded
  unsupported:
    podTemplate:
      spec:
        containers:
        - env:
          - name: KC_SPI_HEALTH_KEYCLOAK_DATABASE_ENABLED
            value: "true"
